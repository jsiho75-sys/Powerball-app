<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>SuperLotto Plus Generator</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --success: #34d399;
      --border: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 50px;
      line-height: 1.4;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin: 8px 0 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .jackpot-card {
      background: linear-gradient(135deg, #1e3a5f, #0f172a);
      border: 1px solid #38bdf8;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .jackpot-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .jackpot-amount { font-size: 2rem; font-weight: 800; color: #38bdf8; margin: 4px 0; }
    .jackpot-date { font-size: 0.9rem; color: #cbd5e1; }

    .recent-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 18px 0 10px;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-btn {
      background: #334155;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .draw-item {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .draw-date { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }

    .draw-numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .mini-ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
    }

    .mini-mega {
      background: linear-gradient(135deg, #f472b6, #c084fc);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #0f172a;
      margin-top: 8px;
    }

    .btn-secondary {
      background: #334155;
      color: white;
      margin-top: 8px;
    }

    .ticket {
      background: #0f172a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      position: relative;
    }

    .ticket-header {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
    }

    .mega {
      background: linear-gradient(135deg, #f472b6, #c084fc);
    }

    .meta { font-size: 0.8rem; color: #94a3b8; }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #334155;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 30px 10px;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #064e3b;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; }

    .error {
      background: #7f1d1d;
      color: #fecaca;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>SuperLotto Plus</h1>
  <div class="subtitle">California • 5 from 1-47 + Mega 1-27</div>

  <!-- Jackpot (loaded dynamically) -->
  <div class="jackpot-card" id="jackpotCard">
    <div class="jackpot-label">Next Estimated Jackpot</div>
    <div class="jackpot-amount" id="jackpotAmount">Loading...</div>
    <div class="jackpot-date" id="jackpotDate">Fetching latest data...</div>
  </div>

  <!-- Last 3 Drawings -->
  <div class="recent-title">
    <span>Last 3 Drawings</span>
    <button class="refresh-btn" onclick="loadLatestResults()">Refresh</button>
  </div>
  <div id="recentDraws">
    <div class="loading">Loading latest results...</div>
  </div>

  <!-- Generator -->
  <div class="card" style="margin-top: 20px;">
    <label for="strategy">Strategy</label>
    <select id="strategy">
      <option value="random">1. Random (Quick Pick)</option>
      <option value="balanced">2. Balanced Odd/Even</option>
      <option value="hot">3. Hot Numbers</option>
      <option value="cold">4. Cold Numbers</option>
      <option value="hotcold">5. Hot + Cold Mix</option>
      <option value="spread">6. Good Spread</option>
      <option value="weighted">7. Weighted</option>
      <option value="weightedBalanced" selected>8. Weighted + Balanced (Recommended)</option>
      <option value="lowhigh">9. Low + High Mix</option>
    </select>

    <label for="count">Number of Tickets</label>
    <input type="number" id="count" value="5" min="1" max="20" />

    <button class="btn-primary" onclick="generate()">Generate Tickets</button>
    <button class="btn-secondary" onclick="clearTickets()">Clear</button>
  </div>

  <div id="results"></div>
  <div class="toast" id="toast">Copied!</div>

  <script>
    // ========== LOAD LIVE DATA ==========
    async function loadLatestResults() {
      const jackpotAmount = document.getElementById("jackpotAmount");
      const jackpotDate = document.getElementById("jackpotDate");
      const recentDraws = document.getElementById("recentDraws");

      recentDraws.innerHTML = `<div class="loading">Loading latest results...</div>`;

      try {
        const res = await fetch("https://www.calottery.com/api/DrawGameApi/DrawGamePastDrawResults/8/1/5");
        const data = await res.json();

        // Next Jackpot
        const next = data.NextDraw;
        const jackpot = next.JackpotAmount;
        const nextDate = new Date(next.DrawDate);

        jackpotAmount.textContent = "$" + (jackpot / 1000000).toFixed(0) + " Million";
        jackpotDate.textContent = nextDate.toLocaleDateString("en-US", {
          weekday: "long", year: "numeric", month: "short", day: "numeric"
        });

        // Last 3 draws
        const draws = data.PreviousDraws.slice(0, 3);
        let html = "";

        draws.forEach(draw => {
          const date = new Date(draw.DrawDate);
          const nums = [];
          let mega = "";

          for (let i = 0; i <= 5; i++) {
            const ball = draw.WinningNumbers[i];
            if (ball.IsSpecial) {
              mega = ball.Number;
            } else {
              nums.push(ball.Number);
            }
          }

          html += `
            <div class="draw-item">
              <div class="draw-date">${date.toLocaleDateString("en-US", {
                weekday: "long", month: "short", day: "numeric", year: "numeric"
              })}</div>
              <div class="draw-numbers">
                ${nums.map(n => `<div class="mini-ball">${n}</div>`).join("")}
                <div class="mini-ball mini-mega">${mega}</div>
              </div>
            </div>
          `;
        });

        recentDraws.innerHTML = html;

      } catch (err) {
        console.error(err);
        recentDraws.innerHTML = `<div class="error">Could not load latest results.<br>Please check your internet connection.</div>`;
        jackpotAmount.textContent = "—";
        jackpotDate.textContent = "Unable to load";
      }
    }

    // Load when app opens
    loadLatestResults();

    // ========== STRATEGIES (same as before) ==========
    const hotNumbers = [3, 7, 12, 19, 25, 32, 36, 41, 45, 5, 11, 18, 27, 34];
    const coldNumbers = [2, 8, 14, 21, 28, 33, 39, 44, 47, 1, 9, 16, 23, 30];

    function randomTicket() {
      const main = sample(range(1, 47), 5).sort((a, b) => a - b);
      return { main, mega: rand(1, 27) };
    }

    function balancedTicket() {
      while (true) {
        const main = sample(range(1, 47), 5).sort((a, b) => a - b);
        const odds = main.filter(n => n % 2 === 1).length;
        const lows = main.filter(n => n <= 24).length;
        if (odds >= 2 && odds <= 3 && lows >= 2 && lows <= 3) {
          return { main, mega: rand(1, 27) };
        }
      }
    }

    function hotTicket() {
      const pool = [...new Set([...hotNumbers, ...sample(range(1, 47), 8)])];
      return { main: sample(pool, 5).sort((a, b) => a - b), mega: rand(1, 27) };
    }

    function coldTicket() {
      const pool = [...new Set([...coldNumbers, ...sample(range(1, 47), 8)])];
      return { main: sample(pool, 5).sort((a, b) => a - b), mega: rand(1, 27) };
    }

    function hotColdTicket() {
      const pool = [...new Set([...hotNumbers, ...coldNumbers])];
      return { main: sample(pool, 5).sort((a, b) => a - b), mega: rand(1, 27) };
    }

    function spreadTicket() {
      while (true) {
        const main = sample(range(1, 47), 5).sort((a, b) => a - b);
        const gaps = [];
        for (let i = 0; i < 4; i++) gaps.push(main[i + 1] - main[i]);
        if (Math.min(...gaps) >= 3 && Math.max(...gaps) <= 18) {
          return { main, mega: rand(1, 27) };
        }
      }
    }

    function weightedTicket() {
      const weights = range(1, 47).map(n => {
        if (hotNumbers.includes(n)) return 2.8;
        if (coldNumbers.includes(n)) return 0.45;
        return 1;
      });
      return {
        main: weightedSample(range(1, 47), weights, 5).sort((a, b) => a - b),
        mega: rand(1, 27)
      };
    }

    function weightedBalancedTicket() {
      for (let i = 0; i < 80; i++) {
        const t = weightedTicket();
        const odds = t.main.filter(n => n % 2 === 1).length;
        const sum = t.main.reduce((a, b) => a + b, 0);
        if (odds >= 2 && odds <= 3 && sum >= 95 && sum <= 135) return t;
      }
      return weightedTicket();
    }

    function lowHighTicket() {
      const lowCount = rand(2, 3);
      const lows = sample(range(1, 24), lowCount);
      const highs = sample(range(25, 47), 5 - lowCount);
      return {
        main: [...lows, ...highs].sort((a, b) => a - b),
        mega: rand(1, 27)
      };
    }

    // Helpers
    function range(start, end) {
      return Array.from({ length: end - start + 1 }, (_, i) => start + i);
    }
    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function sample(arr, k) {
      const copy = [...arr];
      const result = [];
      for (let i = 0; i < k; i++) {
        const idx = Math.floor(Math.random() * copy.length);
        result.push(copy.splice(idx, 1)[0]);
      }
      return result;
    }
    function weightedSample(numbers, weights, k) {
      const result = [], nums = [...numbers], ws = [...weights];
      for (let i = 0; i < k; i++) {
        const total = ws.reduce((a, b) => a + b, 0);
        let r = Math.random() * total, idx = 0;
        for (; idx < ws.length; idx++) {
          r -= ws[idx];
          if (r <= 0) break;
        }
        result.push(nums[idx]);
        nums.splice(idx, 1);
        ws.splice(idx, 1);
      }
      return result;
    }

    // UI
    function generate() {
      const strategy = document.getElementById("strategy").value;
      const count = Math.min(20, Math.max(1, parseInt(document.getElementById("count").value) || 5));
      const results = document.getElementById("results");
      results.innerHTML = "";

      const generators = {
        random: randomTicket,
        balanced: balancedTicket,
        hot: hotTicket,
        cold: coldTicket,
        hotcold: hotColdTicket,
        spread: spreadTicket,
        weighted: weightedTicket,
        weightedBalanced: weightedBalancedTicket,
        lowhigh: lowHighTicket
      };

      const gen = generators[strategy];
      const strategyName = document.getElementById("strategy").selectedOptions[0].text;

      for (let i = 1; i <= count; i++) {
        const ticket = gen();
        const sum = ticket.main.reduce((a, b) => a + b, 0);
        const odds = ticket.main.filter(n => n % 2 === 1).length;

        const div = document.createElement("div");
        div.className = "ticket";
        div.innerHTML = `
          <div class="ticket-header">Ticket ${i} • ${strategyName.split(". ")[1] || strategyName}</div>
          <div class="numbers">
            ${ticket.main.map(n => `<div class="ball">${n}</div>`).join("")}
            <div class="ball mega">${ticket.mega}</div>
          </div>
          <div class="meta">Sum: ${sum} • Odds: ${odds}</div>
          <button class="copy-btn" onclick="copyTicket([${ticket.main}], ${ticket.mega})">Copy</button>
        `;
        results.appendChild(div);
      }
    }

    function copyTicket(main, mega) {
      const text = main.join(" - ") + "  Mega: " + mega;
      navigator.clipboard.writeText(text).then(() => showToast());
    }

    function clearTickets() {
      document.getElementById("results").innerHTML = `<div class="empty">No tickets generated yet</div>`;
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }

    clearTickets();
  </script>
</body>
</html>
